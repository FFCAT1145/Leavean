<style>
  :root {
    --bg: #F5EFEA;
    --blue: #122E8A;
    --blue-hover: #0D2270;
    --line: #DED4CB;
    --ink: #24304F;
    --faint: #A79E97;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    font-weight: 600;
    display: flex;
    flex-direction: column;
  }

  /* 左上角小圖標 */
  .mark {
    position: fixed;
    top: 22px;
    left: 24px;
    width: 34px;
    height: 34px;
    object-fit: contain;
    user-select: none;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 20px 10vh;
    gap: 26px;
  }

  .wrap { width: min(560px, 88vw); }

  .dir {
    border: none;
    background: none;
    padding: 0 0 8px;
    font: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--faint);
    cursor: pointer;
  }
  .dir:hover { color: var(--blue); }

  .bar {
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1.5px solid var(--line);
    padding-bottom: 12px;
    transition: border-color .2s;
  }
  .bar:focus-within { border-color: var(--blue); }

  .bar input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font: inherit;
    font-weight: 600;
    font-size: 17px;
    color: var(--ink);
    padding: 4px 2px;
    min-width: 0;
  }

  .go {
    border: none;
    background: var(--blue);
    color: #fff;
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .2s, transform .12s;
  }
  .go:hover { background: var(--blue-hover); }
  .go:active { transform: scale(.97); }
  .go:disabled { opacity: .5; cursor: default; }

  .out {
    width: min(560px, 88vw);
    font-size: 18px;
    font-weight: 700;
    line-height: 1.9;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
    display: none;
  }
  .out.show { display: block; }
  .out.err { color: #A8432F; font-size: 15px; }

  /* 反饋 */
  .fb {
    width: min(560px, 88vw);
    margin-top: -14px;
    display: none;
  }
  .fb.show { display: block; }
  .fb-link {
    border: none;
    background: none;
    padding: 0;
    font: inherit;
    font-size: 13px;
    color: var(--faint);
    cursor: pointer;
    border-bottom: 1px solid transparent;
  }
  .fb-link:hover { color: var(--blue); border-bottom-color: var(--blue); }

  .fb-form {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
    width: 100%;
  }
  .fb-form.show { display: flex; }
  .fb-form input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font: inherit;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    min-width: 0;
  }
  .fb-form input::placeholder { color: var(--faint); }
  .fb-send {
    border: none;
    background: none;
    font: inherit;
    font-size: 13px;
    color: var(--blue);
    cursor: pointer;
    padding: 2px 4px;
    flex-shrink: 0;
  }
  .fb-send:disabled { color: var(--faint); cursor: default; }

  /* 詞庫入口 */
  .dict-link {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    border: none;
    background: none;
    font: inherit;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--faint);
    cursor: pointer;
    padding: 4px 8px;
    z-index: 5;
  }
  .dict-link:hover { color: var(--blue); }

  /* 詞庫編輯面板 */
  .panel {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    flex-direction: column;
    padding: 22px 24px 18px;
    z-index: 20;
  }
  .panel.show { display: flex; }
  .panel textarea {
    flex: 1;
    width: min(720px, 100%);
    margin: 0 auto;
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    outline: none;
    resize: none;
    padding: 16px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.9;
    color: var(--ink);
  }
  .panel textarea:focus { border-color: var(--blue); }
  .panel-actions {
    width: min(720px, 100%);
    margin: 14px auto 0;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 22px;
  }
  .panel-btn {
    border: none;
    background: none;
    font: inherit;
    font-size: 13px;
    color: var(--faint);
    cursor: pointer;
  }
  .panel-btn:hover { color: var(--ink); }
  .panel-btn.primary {
    background: var(--blue);
    color: #fff;
    padding: 8px 24px;
    border-radius: 999px;
  }
  .panel-btn.primary:hover { background: var(--blue-hover); color: #fff; }
  .panel-btn:disabled { opacity: .5; cursor: default; }
  .panel-note { font-size: 12px; color: var(--faint); margin-right: auto; }

  .spin {
    width: 15px;
    height: 15px;
    border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: inline-block;
    vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

  const DEFAULT_DICT = DICTIONARY.trim();

  const RULES_TO_ZH = `【翻譯要求】

2. 只輸出譯文本身：不要逐詞對照，不要標註詞性，不要解釋，不要複述詞典內容，不要加「譯文：」等前綴，不要寒暄。
3. 輸入是單詞或詞組時，直接給出漢語釋義；多個義項用「；」分隔。
4. 輸入是句子時，直接給出通順的漢語整句，並遵循詞典【語法】一節的句型與詞綴規則。
5. 詞典中沒有的詞不要臆造釋義，可在譯文中用「（詞典未收錄）」標註，並給出拼寫最接近的已收錄詞。
6. 大小寫、重音符號（é、à 等）不改變詞義。
7. 若輸入明顯不是里府語（例如漢語或英語），只回一句：本工具只做里府語→漢語翻譯。`;

  const RULES_TO_LE = `【翻譯要求】
1. 用戶輸入的內容視為漢語，請翻譯成里府語（Leavéan）。
2. 只輸出里府語譯文本身：不要標註詞性，不要解釋，不要複述詞典內容，不要加前綴，不要寒暄。
3. 優先使用詞典中已收錄的詞；查不到時，用詞典【語法】的前綴後綴與句型規則構造（動詞 -si、副詞 -vo、形容詞 -ble/-cre/-re、過去式 -ca、進行時 -ow、將來時 al-、完成時 aka + V.、被動 evo + V.、複數 -ia、否定 int 的位置）。
4. 確實無法構造的詞，用最接近的已收錄詞，並在後面標註（詞典未收錄）。

【詞典】（格式：詞條 詞性 釋義；含語法章節）
__DICTIONARY__

__RULES__`;

  let modelId = null;
  let busy = false;
  let corrections = [];          // 使用者回饋修正記憶
  let dictText = DEFAULT_DICT;   // 當前生效詞庫（雲端最新版）
  let dirToZh = true;            // true：里府語→漢語；false：漢語→里府語
  let lastQuery = '';
  let lastAnswer = '';

  const $ = id => document.getElementById(id);

  /* ===== 模型（優先選響應快、不貴的，避免長時間思考） ===== */
  const PREFERRED_MODELS = ['hy3', 'hy3-x', 'glm-5.3-flash', 'deepseek-v4.1-flash'];

  /* 防止請求懸掛：超過 ms 直接判失敗 */
  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms)),
    ]);
  }

  async function loadModels() {
    const attempt = async () => {
      const models = await withTimeout(cloud.llm.models.list(), 8000);
      const usable = models.filter(m => m.disabled !== true);
      const pick = PREFERRED_MODELS.map(id => usable.find(m => m.id === id)).find(Boolean);
      return (pick || usable[0]) ? (pick || usable[0]).id : null;
    };
    for (let i = 0; i < 2; i++) {          // 最多試兩次
      try {
        const id = await attempt();
        if (id) { modelId = id; return; }
      } catch (e) { /* 失敗則短暫等待後重試 */ }
      await new Promise(r => setTimeout(r, 600));
    }
    modelId = FALLBACK_MODEL;              // 列表拿不到也要能翻，真失敗時由錯誤碼提示
  }

  /* ===== 詞庫：讀取 + 保存（每次保存新增一版，取最新為準） ===== */
  async function loadDictionary() {
    try {
      const { data, error } = await cloud.database
        .from('dict_revisions')
        .select('content')
        .order('created_at', { ascending: false })
        .limit(1);
      if (error) throw error;
      const latest = Array.isArray(data) && data[0] && data[0].content;
      dictText = latest ? String(data[0].content).trim() : DEFAULT_DICT;
    } catch (e) {
      dictText = DEFAULT_DICT;
    }
  }

  async function saveDictionary(text) {
    const { error } = await cloud.database
      .from('dict_revisions')
      .insert({ content: text, note: 'edit' });
    if (error) throw error;
  }

  /* ===== 修正記憶：讀取 + 寫入 ===== */
  async function loadCorrections() {
    try {
      const { data, error } = await cloud.database
        .from('corrections')
        .select('source_text, correction')
        .order('created_at', { ascending: false })
        .limit(60);
      if (error) throw error;
      corrections = Array.isArray(data) ? data : [];
    } catch (e) {
      corrections = [];
    }
  }

  async function saveCorrection(source, aiTranslation, correction) {
    const { error } = await cloud.database
      .from('corrections')
      .insert({ source_text: source, ai_translation: aiTranslation, correction });
    if (error) throw error;
  }

  function buildSystemPrompt() {
    const rules = dirToZh ? RULES_TO_ZH : RULES_TO_LE;
    let prompt = BASE_PROMPT_TEMPLATE
      .replace('__DICTIONARY__', dictText || DEFAULT_DICT)
      .replace('__RULES__', rules);

    const lines = corrections
      .filter(c => c && c.source_text && c.correction)
      .map(c => `${String(c.source_text).trim()} = ${String(c.correction).trim()}`)
      .join('\n');

      prompt += `

以下條目來自使用者的反饋糾錯，視為對詞典的補充與修正。遇到相同或高度相似的輸入時，必須嚴格採用這裡的譯法，不要沿用詞典中的舊譯法：

`;

      clearTimeout(timer);
      busy = false;
      goEl.disabled = false;
      goEl.textContent = '翻譯';
    }
  }

  /* ===== 反饋 ===== */
  fbLink.addEventListener('click', () => {
    fbForm.classList.add('show');
    fbLink.style.display = 'none';
    fbInput.focus();
  });

  async function submitFeedback() {
    const correction = fbInput.value.trim();
    if (!correction || fbSend.disabled) return;
    fbSend.disabled = true;
    fbSend.textContent = '…';
    try {
      await saveCorrection(lastQuery, lastAnswer, correction);
      await loadCorrections();          // 立即生效，下一次翻譯就帶上這條記憶
      fbForm.classList.remove('show');
      fbLink.style.display = '';
      fbLink.textContent = '已記住';
      setTimeout(() => { fbLink.textContent = '反饋'; }, 2600);
    } catch (e) {
      fbSend.textContent = '提交';
      fbSend.disabled = false;
      fbForm.classList.remove('show');
      fbLink.style.display = '';
      fbLink.textContent = '提交失敗，重試';
      return;
    }
    fbSend.textContent = '提交';
    fbSend.disabled = false;
    fbInput.value = '';
  }

  fbSend.addEventListener('click', submitFeedback);
  fbInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submitFeedback(); }
  });

  /* ===== 詞庫編輯面板 ===== */
  function openDict() {
    dictArea.value = dictText;
    dictNote.textContent = '';
    dictSave.textContent = '保存';
    dictSave.disabled = false;
    dictPanel.classList.add('show');
    dictArea.focus();
    dictArea.setSelectionRange(0, 0);
  }
  function closeDict() { dictPanel.classList.remove('show'); }

  async function commitDict() {
    const text = dictArea.value.trim();
    if (!text || dictSave.disabled) return;
    dictSave.disabled = true;
    dictSave.textContent = '…';
    try {
      await saveDictionary(text);
      await loadDictionary();            // 立即生效，後續翻譯用新詞庫
      dictNote.textContent = '已保存，立即生效';
      setTimeout(closeDict, 700);
    } catch (e) {
      dictNote.textContent = '保存失敗，請重試';
      dictSave.disabled = false;
      dictSave.textContent = '保存';
    }
  }

  dictLink.addEventListener('click', openDict);
  dictCancel.addEventListener('click', closeDict);
  dictSave.addEventListener('click', commitDict);
  dictArea.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); commitDict(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && dictPanel.classList.contains('show')) closeDict();
  });

  /* ===== 主交互 ===== */
  goEl.addEventListener('click', translate);
  qEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); translate(); }
  });

  (async function init() {
    const sdkOk = await ensureSdk();
    if (!sdkOk) {
      show('翻譯組件載入失敗，請檢查網路後刷新頁面。', true);
      goEl.disabled = true;
      return;
    }
    cloud = WorkBuddyCloud.createWorkBuddyCloud({
      endpoint: publicConfig.endpoint,
      oauthRelayBaseUrl: publicConfig.oauthRelayBaseUrl,
      publishableKey: publicConfig.publishableKey,
    });
    await Promise.all([loadCorrections(), loadDictionary()]);
    loadModels();          // 後台載入，不阻塞；點翻譯時若還沒好會自動補載
    qEl.focus();
  })();
</script>
</body>
</html>
